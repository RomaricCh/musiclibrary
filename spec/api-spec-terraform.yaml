openapi: "3.0.1"
info:
  version: "1"
  title: "songs documentation"

servers:
  - url: "https://{api_id}.execute-api.${aws_region}.amazonaws.com/live"
    variables:
      api_id:
        default: api_id
        description: set api id

paths:
  /songs:
    post:
      summary: "Create a song"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Song"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
      security:
        - sigv4: []
      x-amazon-apigateway-request-validator: validate_request
      x-amazon-apigateway-integration:
        responses:
          default:
            statusCode: "201"
        uri: "${create_song_lambda_arn}"
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy

    get:
      summary: "Get a song by author and title"
      parameters:
        - in: query
          name: author
          required: true
          schema:
            type: string
        - in: query
          name: title
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
      security:
        - sigv4: [ ]
      x-amazon-apigateway-request-validator: validate_request
      x-amazon-apigateway-integration:
        responses:
          default:
            statusCode: "201"
        uri: "${find_song_lambda_arn}"
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy

  /songs/{uuid}:
    delete:
      summary: "Delete song by uuid"
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"
      security:
        - sigv4: []
      x-amazon-apigateway-integration:
        responses:
          default:
            statusCode: "200"
        uri: "${delete_song_lambda_arn}"
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy

components:
  schemas:
    Song:
      type: object
      properties:
        author:
          type: string
        title:
          type: string
        genre:
          type: string
        date:
          type: string
        uuid:
          type: string
    Empty:
      type: string

  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: awsSigv4

x-amazon-apigateway-request-validators:
  validate_request:
    validateRequestBody: true
    validateRequestParameters: true
